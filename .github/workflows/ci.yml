name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      # No solo-founder-crew here: the tests fake the CrewGateway at the seam,
      # so the API suite runs without the (private) framework repo present.
      - run: pip install -r requirements-dev.txt
      # ../scripts too: they are real Python (migrations, setup checks, the dev
      # orchestrator) and were previously outside CI's reach entirely.
      - run: ruff check . ../scripts
      - run: pytest -q

  web:
    name: web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `next build` runs ESLint and TypeScript checks as part of the build.
      - run: npm run build
